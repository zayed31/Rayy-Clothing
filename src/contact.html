<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAYY — Contact</title>
  <title>Contact Us — RAYY | Custom Apparel, Orders & Collaborations</title>

  <!-- Primary Meta Tags -->
  <meta name="title" content="Contact Us — RAYY | Custom Apparel, Orders & Collaborations">
  <meta name="description" content="Connect with the RAYY team for custom apparel printing, wholesale inquiries, collaborations, or customer assistance via WhatsApp.">
  <meta name="keywords" content="contact RAYY, custom streetwear orders, apparel printing inquiry, DTF custom tees, RAYY whatsapp support">
  <meta name="author" content="RAYY">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#090909">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RAYY">
  <meta property="og:title" content="Contact RAYY — Custom Apparel & Inquiries">
  <meta property="og:description" content="Reach out to the RAYY team for custom pieces, orders, collaborations, or questions.">
  <meta property="og:image" content="assets/additionalimages/home_comfort_image.webp">
  <meta property="og:image:alt" content="Contact RAYY">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact RAYY — Custom Apparel & Inquiries">
  <meta name="twitter:description" content="Reach out to the RAYY team for custom pieces, orders, collaborations, or questions.">
  <meta name="twitter:image" content="assets/additionalimages/home_comfort_image.webp">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/additionalimages/favicon.png">
  <link rel="apple-touch-icon" href="assets/additionalimages/favicon.png">

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/global.css">

  <!-- Structured Data (Schema.org) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ContactPage",
    "name": "Contact RAYY",
    "description": "Customer support and custom inquiries for RAYY apparel.",
    "url": "https://rayyclothing.com/contact.html",
    "mainEntity": {
      "@type": "Organization",
      "name": "RAYY",
      "url": "https://rayyclothing.com",
      "logo": "https://rayyclothing.com/assets/additionalimages/favicon.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English"]
      }
    }
  }
  </script>
</head>

<body>
  <header class="navbar"></header>

  <main class="page-shell contact-page">

    <section class="page-header">
      <div class="page-header-title">
        <p class="section-label">GET IN TOUCH</p>
        <h1>LET'S TALK<br><span>RAYY.</span></h1>
      </div>

      <div class="page-header-aside">
        <p class="page-header-description">
          For orders, custom pieces, collaborations or questions, reach out to us. We will get back to you shortly.
        </p>
      </div>
    </section>

    <a class="btn btn-dark" id="contactBtn" href="https://wa.me/YOUR_WHATSAPP_NUMBER?text=Hi%20RAYY%2C%20I%20would%20like%20to%20get%20in%20touch%20regarding%20orders%2C%20custom%20pieces%2C%20or%20general%20inquiries." target="_blank">CHAT ON WHATSAPP</a>
  </main>
  <footer class="footer">
    <div class="logo">
      <img src="assets/additionalimages/favicon.png" alt="RAYY" class="logo-icon">
    </div>
    <p class="footer-tagline">Comfort. Style. You.</p>
    <p class="footer-rights">© 2026 RAYY. All rights reserved.</p>
  </footer>

  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script type="module">
    import { openWhatsApp } from "./js/whatsapp.js";
    const contactBtn = document.getElementById("contactBtn");
    if (contactBtn) {
      contactBtn.addEventListener("click", (e) => {
        e.preventDefault();
        const message = "Hi RAYY, I would like to get in touch regarding orders, custom pieces, or general inquiries.";
        openWhatsApp(message);
      });
    }
  </script>
</body>

</html>
